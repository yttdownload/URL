name: "🗑 پاکسازی پوشه دانلودها"

on:
  workflow_dispatch:
    inputs:
      warning:
        description: '⚠️ هشدار: این کار همه فایل‌های داخل پوشه downloads/ را حذف می‌کند. فقط در صورت اطمینان اجرا کن.'
        required: false
        default: 'قبل از اجرا هشدار را بخوانید'

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: تنظیمات گیت
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: پاکسازی پوشه دانلودها
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          echo "در حال پاکسازی پوشه downloads ..."
          echo ""

          if [ -d "downloads" ]; then
            echo "حذف پوشه downloads ..."
            git rm -rf downloads/ 2>/dev/null || true
            rm -rf downloads/ 2>/dev/null || true
          else
            echo "پوشه downloads وجود ندارد، ساخته می‌شود."
          fi

          mkdir -p downloads
          echo '# خالی' > downloads/README.md
          echo 'برای شروع به تب Actions برو و از workflows سمت چپ استفاده کن' >> downloads/README.md

          git add -f downloads/README.md

          if git diff --staged --quiet; then
            echo "هیچ تغییری برای کامیت وجود ندارد."
            exit 0
          fi

          git commit -m "پاکسازی پوشه downloads"

          echo "در حال ارسال تغییرات..."

          RETRY=0
          MAX_RETRIES=5
          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY + 1))

            git fetch origin "$BRANCH" --quiet 2>/dev/null || true
            git rebase origin/"$BRANCH" 2>/dev/null || {
              git rebase --abort 2>/dev/null || true
              git reset --hard HEAD~1 2>/dev/null || true
              git pull --rebase origin "$BRANCH" 2>/dev/null || true

              rm -rf downloads/ 2>/dev/null || true
              mkdir -p downloads
              echo '# خالی' > downloads/README.md
              echo 'برای شروع به تب Actions برو و از workflows سمت چپ استفاده کن' >> downloads/README.md
              git add -f downloads/README.md
              git commit -m "پاکسازی پوشه downloads" 2>/dev/null || true
            }

            if timeout 60 git push origin HEAD:"$BRANCH" 2>&1; then
              echo ""
              echo "=========================================="
              echo "✅ پوشه downloads با موفقیت پاک شد!"
              echo "=========================================="
              exit 0
            else
              echo "ارسال تغییرات ناموفق بود، تلاش $RETRY از $MAX_RETRIES..."
              sleep $((2 + RANDOM % 5))
            fi
          done

          echo "❌ ارسال تغییرات پس از $MAX_RETRIES تلاش ناموفق بود"
          exit 1
